# Runs the whole thing: database plus application.
#
#   docker compose up -d          start
#   docker compose up -d postgres start the database only (for local development)
#   docker compose logs -f app    follow the application log
#   docker compose down           stop, keeping data
#   docker compose down -v        stop and wipe the database
#
# Values come from .env, which compose reads automatically. Copy .env.example
# to .env first.

services:

  postgres:
    # Pinned, never :latest. A floating tag means rebuilding the environment
    # six months from now silently gives you a different database version.
    image: postgres:17-alpine
    container_name: sift-postgres
    restart: unless-stopped

    environment:
      # No default after the colon: start-up fails if the variable is missing.
      # Better than quietly coming up with a weak password.
      POSTGRES_DB: ${SIFT_DB_NAME:?SIFT_DB_NAME is not set; copy .env.example to .env}
      POSTGRES_USER: ${SIFT_DB_USER:?SIFT_DB_USER is not set}
      POSTGRES_PASSWORD: ${SIFT_DB_PASSWORD:?SIFT_DB_PASSWORD is not set}

    ports:
      # host:container. Exposed so IntelliJ and psql can reach it directly.
      - "5432:5432"

    volumes:
      # Without this the data lives in the container's writable layer and
      # disappears with the container.
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # "Container started" is not "database accepts connections": the first
      # start has to initialise the data directory, which takes a few seconds.
      #
      # $$ becomes a single $ inside the container, so these resolve there,
      # against POSTGRES_USER rather than the SIFT_ variables on the host.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sift:local
    container_name: sift-app
    restart: unless-stopped

    depends_on:
      postgres:
        # service_healthy, not service_started. Waiting only for "started"
        # means Flyway can open a connection before the server is listening,
        # and the application dies on boot with a stack trace that looks like
        # a bug rather than a race.
        condition: service_healthy

    environment:
      # Layers application-prod.yml on top of application.yml: SQL logging off,
      # health details hidden, stack traces kept out of responses.
      #
      # application.yml on its own is tuned for a laptop, and a container is
      # not a laptop.
      SPRING_PROFILES_ACTIVE: prod

      # postgres, not localhost. Inside the compose network, localhost is this
      # container; the database answers to its service name.
      SIFT_DB_HOST: postgres
      SIFT_DB_PORT: 5432
      SIFT_DB_NAME: ${SIFT_DB_NAME}
      SIFT_DB_USER: ${SIFT_DB_USER}
      SIFT_DB_PASSWORD: ${SIFT_DB_PASSWORD}

      SIFT_JWT_SECRET: ${SIFT_JWT_SECRET}
      SIFT_ENCRYPTION_SECRET: ${SIFT_ENCRYPTION_SECRET}

      # Defaults to false anyway; stated explicitly because leaving the fake
      # summarizer reachable in a deployed environment would be a real bug.
      SIFT_SUMMARIZE_ALLOW_FAKE: "false"

    ports:
      - "8080:8080"

volumes:
  postgres_data:
