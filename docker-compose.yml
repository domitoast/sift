# Sift 開發環境
#
# 啟動：docker compose up -d
# 停止：docker compose down          （資料保留）
# 停止並清空資料：docker compose down -v
# 查看日誌：docker compose logs -f postgres
# 進入資料庫：docker compose exec postgres psql -U sift -d sift

services:

  postgres:
    # image 名稱與版本標籤。
    # 一律鎖定明確版本（17-alpine），不要用 latest——
    # latest 會隨時間變動，某天重建環境就換成不同版本，行為可能不一致。
    # alpine 是精簡版 Linux，映像檔小很多（約 80MB vs 400MB）。
    image: postgres:17-alpine

    # 容器名稱。不指定的話 Docker 會自動生成像 sift-postgres-1 這種名字。
    container_name: sift-postgres

    # 容器意外停止時自動重啟，但你手動停止時不會。
    restart: unless-stopped

    environment:
      # postgres 這個 image 支援的環境變數，啟動時會依此建立資料庫與帳號。
      #
      # ${...} 的值來自同目錄的 .env 檔——docker compose 會自動讀取它，
      # 不需要任何額外設定或外掛。
      #
      # 冒號後面沒有預設值，代表「.env 裡沒設就報錯」。
      # 這是刻意的：寧可啟動失敗，也不要偷偷用一個弱密碼跑起來。
      POSTGRES_DB: ${SIFT_DB_NAME:?SIFT_DB_NAME 未設定，請複製 .env.example 為 .env}
      POSTGRES_USER: ${SIFT_DB_USER:?SIFT_DB_USER 未設定}
      POSTGRES_PASSWORD: ${SIFT_DB_PASSWORD:?SIFT_DB_PASSWORD 未設定}

    ports:
      # 格式是「你電腦的 port : 容器裡的 port」。
      # 5432 是 PostgreSQL 的預設 port。
      # 如果你電腦上已經有東西佔用 5432，把左邊改成 5433 即可，
      # 容器內部不受影響。
      - "5432:5432"

    volumes:
      # 把容器內的資料目錄對應到一個由 Docker 管理的具名 volume。
      # 沒有這行的話，容器一刪除，資料庫內容全部消失。
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # 定期檢查資料庫是否真的可以接受連線。
      # 這很重要：容器「啟動」不等於資料庫「準備好」——
      # PostgreSQL 第一次啟動要初始化，大約需要幾秒。
      # 之後應用程式容器可以用 depends_on + condition 等它就緒再啟動。
      # 注意 $$ 的寫法：compose 看到 $$ 會還原成單一個 $ 再交給容器，
      # 因此這個變數是在「容器內部」求值的。
      # 容器內存在的是 POSTGRES_USER / POSTGRES_DB（上面 environment 設的），
      # 而不是 SIFT_ 開頭那些——那些只存在於你的電腦上。
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s      # 每 5 秒檢查一次
      timeout: 3s       # 單次檢查超過 3 秒視為失敗
      retries: 5        # 連續失敗 5 次才標記為 unhealthy
      start_period: 10s # 啟動後前 10 秒的失敗不計入

volumes:
  # 宣告具名 volume。實際檔案由 Docker 管理，
  # 位置在 Docker 的內部儲存區，不在專案資料夾裡。
  postgres_data:
