# Test on every push; publish an image only from main.
#
# Two jobs rather than one, because they answer different questions:
#
#   test   is this change correct?
#   image  can this change be shipped?
#
# Splitting them means a failing test never produces an image, and the image
# job's logs are not buried under 221 test results.

name: CI

on:
  push:
  pull_request:

# Cancel a run when a newer commit arrives on the same branch. Without this,
# pushing three times in a minute runs three full builds and you wait for the
# answer to a question you already changed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ---------------------------------------------------------------------------
  test:
  # ---------------------------------------------------------------------------
    runs-on: ubuntu-latest

    steps:
      # Without checkout the runner does not even have mvnw.
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.m2. Saves two to three minutes of re-downloading Spring,
          # Hibernate and Rome on every run.
          cache: maven

      # No postgres service here on purpose. Testcontainers starts its own
      # database from PostgresTestBase, and the runner already has a Docker
      # daemon. A service container would be a second, unused PostgreSQL whose
      # credentials had to be kept in sync with application-test.yml by hand.
      #
      # It also means CI and a laptop run the tests the same way, so a failure
      # is never "is this an environment difference or a real bug?".
      - name: Run tests
        run: ./mvnw --batch-mode test

      # Surefire reports are the only way to see which test failed after the
      # runner is gone. if: always() matters: on success this is noise, but on
      # failure it is the entire point, and the default only uploads on success.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # ---------------------------------------------------------------------------
  image:
  # ---------------------------------------------------------------------------
    # Only after tests pass. This one line is what makes the pipeline a gate
    # rather than a pair of unrelated scripts.
    needs: test

    # Only from main. Feature branches get tested, not published: a registry
    # full of images from half-finished branches is a registry nobody trusts.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to push to GitHub Container Registry. Granted per job rather
      # than per workflow, so the test job cannot publish anything.
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Enables build cache and multi-platform builds.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is minted per run and expires with it, so there is no
      # long-lived credential to leak or rotate.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces the tags and OCI labels. Every image ends up carrying the
      # commit it was built from, which is what makes "which version is
      # running?" answerable during an incident.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache stored in GitHub Actions' own cache. Without it every
          # run re-downloads every Maven and npm dependency from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building an image proves it compiles, not that it starts. A missing
      # environment variable or a broken entrypoint only shows up at runtime,
      # and finding that out in production is finding it out too late.
      #
      # The keys below are throwaway values, decoded and checked for length:
      # the JWT one is 64 bytes for HS512, the encryption one is exactly 32
      # for AES-256. A wrong length here fails at startup, and the symptom is
      # a health check that simply never turns green.
      - name: Smoke test the image
        run: |
          docker network create sift-ci

          docker run -d --name db --network sift-ci \
            -e POSTGRES_DB=sift -e POSTGRES_USER=sift -e POSTGRES_PASSWORD=ci-only \
            postgres:17-alpine

          # Wait for the database rather than sleeping a fixed amount: a sleep
          # is either too short on a slow runner or wasted time on a fast one.
          for i in $(seq 1 30); do
            docker exec db pg_isready -U sift -d sift && break
            sleep 2
          done

          # Same profile the compose file uses. Smoke-testing a different
          # configuration than the one that ships would defeat the point.
          docker run -d --name app --network sift-ci -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SIFT_DB_HOST=db \
            -e SIFT_DB_NAME=sift \
            -e SIFT_DB_USER=sift \
            -e SIFT_DB_PASSWORD=ci-only \
            -e SIFT_JWT_SECRET=Y2ktb25seS1qd3Qtc2VjcmV0LWxvbmctZW5vdWdoLWZvci1oczUxMi1zaWduaW5nLXBhZGRpbmctcGFkZGluZw== \
            -e SIFT_ENCRYPTION_SECRET=Y2ktb25seS1lbmNyeXB0aW9uLWtleS1leGFjdGx5MzI= \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done

          # Everything needed to tell "crashed on boot" from "still starting"
          # apart, in one place. Without the container state, an empty log
          # looks the same as a container that never started.
          echo "::error::the image did not become healthy"
          docker ps -a
          echo "--- app ---"
          docker logs app
          echo "--- db ---"
          docker logs db --tail 20
          exit 1
