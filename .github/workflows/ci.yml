# =============================================================================
# CI：每次 push 自動在一台乾淨的機器上跑完整測試
#
# 【為什麼需要】
#
# 在這之前，品質保證靠的是「我記得跑 mvnw test」。
# 任何靠「記得」的機制遲早會失效——不是因為人懶，是因為趕。
#
# CI 還會抓到一類本機永遠抓不到的問題：「在我電腦上可以跑」。
# 因為它每次都是全新的機器，什麼都沒裝。
#   - Day 12：mvn 只存在於 IntelliJ 裡，README 的指令對別人是假的
#   - Day 18：SIFT_ENCRYPTION_SECRET 設在 IDE 裡，沒寫進任何文件
#
# 【檔案位置是固定的】
#
# 必須放在 .github/workflows/ 底下，副檔名 .yml 或 .yaml。
# 檔名本身自由（ci.yml 只是慣例）。
# =============================================================================

name: CI

# 觸發條件。目前只有一個人一個分支，push 就夠了。
# 日後開始用 branch + PR 的話，再加 pull_request。
on: push

jobs:
  test:
    # 每次都是全新的 Ubuntu，跑完就丟掉。
    # 「乾淨的機器跑得起來」才代表別人也跑得起來。
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------------
    # services 與 steps 的差別：
    #   step    執行一次，做完就結束
    #   service 整個 job 期間一直開著
    #
    # 162 個測試裡有 80 個會真的連資料庫，所以必須是 service。
    # -------------------------------------------------------------------------
    services:
      postgres:
        image: postgres:17-alpine

        # ⚠️ 這三個值必須與 src/test/resources/application-test.yml 完全一致，
        #    否則測試連得到資料庫但認證失敗。
        #
        #    這是測試專用的假密碼，本來就在版控裡，不是機密。
        env:
          POSTGRES_DB: sift
          POSTGRES_USER: sift
          POSTGRES_PASSWORD: local_dev_only_change_me

        # 把容器的 5432 對應到 runner 的 5432，
        # 測試才連得到 jdbc:postgresql://localhost:5432/sift
        ports:
          - 5432:5432

        # ⚠️ 容器「啟動」不等於資料庫「準備好」——PostgreSQL 初始化要幾秒。
        #
        # 沒有這段，測試會在資料庫還沒好的時候開始跑，
        # 拿到「連線被拒絕」——而程式其實沒問題。
        #
        # 這與 docker-compose.yml 裡的 healthcheck 是同一件事。
        options: >-
          --health-cmd "pg_isready -U sift -d sift"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      # uses = 用別人寫好的動作。
      # checkout 把 repo 抓到這台機器上——沒有它，機器上連 mvnw 都沒有。
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Java 21
        uses: actions/setup-java@v4
        with:
          # Temurin 是最常用的免費 JDK 發行版
          distribution: temurin
          # 與 pom.xml 的 <java.version>21</java.version> 一致
          java-version: '21'
          # 把下載過的函式庫快取起來。
          # 沒有它，每次 CI 都要重新下載 Spring、Hibernate、Rome…約多花 2-3 分鐘。
          cache: maven

      # run = 直接執行一個指令。
      #
      # ./mvnw 而不是 .\mvnw.cmd —— CI 跑的是 Linux。
      # 這是 Day 13 產生 Maven Wrapper 的回報：不需要先安裝 Maven。
      #
      # --batch-mode 關掉下載進度條。那東西在終端機好看，在 log 裡是幾千行垃圾。
      - name: 執行測試
        run: ./mvnw --batch-mode test
