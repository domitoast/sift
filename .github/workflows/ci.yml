# =============================================================================
# CI：每次 push 自動在一台乾淨的機器上跑完整測試
#
# 【為什麼需要】
#
# 在這之前，品質保證靠的是「我記得跑 mvnw test」。
# 任何靠「記得」的機制遲早會失效——不是因為人懶，是因為趕。
#
# CI 還會抓到一類本機永遠抓不到的問題：「在我電腦上可以跑」。
# 因為它每次都是全新的機器，什麼都沒裝。
#   - Day 12：mvn 只存在於 IntelliJ 裡，README 的指令對別人是假的
#   - Day 18：SIFT_ENCRYPTION_SECRET 設在 IDE 裡，沒寫進任何文件
#
# 【檔案位置是固定的】
#
# 必須放在 .github/workflows/ 底下，副檔名 .yml 或 .yaml。
# 檔名本身自由（ci.yml 只是慣例）。
# =============================================================================

name: CI

# 觸發條件。目前只有一個人一個分支，push 就夠了。
# 日後開始用 branch + PR 的話，再加 pull_request。
on: push

jobs:
  test:
    # 每次都是全新的 Ubuntu，跑完就丟掉。
    # 「乾淨的機器跑得起來」才代表別人也跑得起來。
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------------
    # 這裡原本有一段 services.postgres（image、env、ports、health-cmd 共 30 行）。
    #
    # 【為什麼刪掉】
    #
    # Day 22 測試改用 Testcontainers 之後，資料庫由測試自己啟動：
    # PostgresTestBase 會起一個 postgres:17-alpine 容器，
    # @ServiceConnection 把隨機 port 的連線資訊注入 Spring。
    #
    # 留著 service 的話會變成「兩個 PostgreSQL 同時在跑，其中一個沒人用」，
    # 而且它的帳密必須跟 application-test.yml 手動保持一致——
    # 那正是 Testcontainers 要消除的那種「靠人記得同步」的設定。
    #
    # 附帶好處：CI 環境與本機環境從此是同一套機制。
    # 以前是「本機連自己的 Docker，CI 連 service 容器」，兩邊不一樣，
    # 出問題時得先問「這是環境差異還是真的 bug」。
    #
    # ubuntu-latest 的 runner 本身就有 Docker daemon，Testcontainers 直接可用。
    # -------------------------------------------------------------------------

    steps:
      # uses = 用別人寫好的動作。
      # checkout 把 repo 抓到這台機器上——沒有它，機器上連 mvnw 都沒有。
      #
      # ⚠️ 版本要寫死（@v5 而不是 @main）。
      #    寫 @main 的話，別人改了他們的程式碼，你的 CI 會在你什麼都沒動的
      #    情況下突然壞掉——而且你查不到是誰改的。
      - name: 取得程式碼
        uses: actions/checkout@v5

      - name: 安裝 Java 21
        uses: actions/setup-java@v5
        with:
          # Temurin 是最常用的免費 JDK 發行版
          distribution: temurin
          # 與 pom.xml 的 <java.version>21</java.version> 一致
          java-version: '21'
          # 把下載過的函式庫快取起來。
          # 沒有它，每次 CI 都要重新下載 Spring、Hibernate、Rome…約多花 2-3 分鐘。
          cache: maven

      # run = 直接執行一個指令。
      #
      # ./mvnw 而不是 .\mvnw.cmd —— CI 跑的是 Linux。
      # 這是 Day 13 產生 Maven Wrapper 的回報：不需要先安裝 Maven。
      #
      # --batch-mode 關掉下載進度條。那東西在終端機好看，在 log 裡是幾千行垃圾。
      - name: 執行測試
        run: ./mvnw --batch-mode test
