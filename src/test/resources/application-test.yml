# Test profile. Only lists what differs from application.yml.
#
# There is deliberately no datasource block: PostgresTestBase supplies the
# connection through Testcontainers. Leaving a fallback here would let the
# suite quietly pollute the development database if that wiring ever broke.

spring:
  jpa:
    show-sql: false

sift:
  jwt:
    # Fake key, safe to commit. Still long enough for HS512.
    secret: dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLXVuaXQtdGVzdHMtbm90LWZvci1wcm9kdWN0aW9uLXVzZS1hdC1hbGwtcGFkZGluZw==

  encryption:
    # Fake key, safe to commit. Decodes to exactly 32 bytes.
    secret: c2lmdC10ZXN0LWVuY3J5cHRpb24ta2V5LTMyYnl0ZXM=

  scheduling:
    # Scheduled tasks would reach the real network mid-test.
    enabled: false

  fetch:
    # The test HTTP server runs on localhost, which is what SSRF protection blocks.
    allow-internal-address: true
    connect-timeout: 2s
    request-timeout: 2s
    max-body-bytes: 1024
    # Long enough that live work is never reaped, short enough that a row
    # backdated by the test is.
    stuck-timeout: 30s

  async:
    # Synchronous executor: the background work is done by the time the
    # response returns, so assertions need no sleeps.
    enabled: false

  summarize:
    allow-fake: true
    daily-quota: 3
    # Must stay below daily-quota, otherwise the quota masks the batch limit
    # and the batching behaviour is never actually exercised.
    batch-size: 2

logging:
  level:
    org.flywaydb: WARN
    dev.sift: INFO
