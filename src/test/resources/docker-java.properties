# =============================================================================
# docker-java 的設定（Testcontainers 內部用它跟 Docker 溝通）
#
# 【解決什麼問題】
#
# Docker Engine 29 起，不再接受 1.44 以下的 API 版本。
# 而 docker-java 在偵測不到版本時，會退回寫死的預設值 1.32——
# Docker 收到就直接回 400 Bad Request。
#
# Testcontainers 把那個 400 解讀成「找不到 Docker」，於是你會看到：
#
#   Could not find a valid Docker environment.
#   Please see logs and check configuration
#
# 這個訊息是誤導的。Docker 明明在跑（docker info、docker run 都正常），
# 問題是 docker-java 講了一種 Docker 29 聽不懂的方言，
# 然後把「聽不懂」當成「不存在」。
#
# docker CLI 不會踩到，因為它會先做版本協商；docker-java 不會。
#
# 【為什麼是 1.44】
#
# Docker Engine 29 支援的最低版本。挑最低的，相容範圍最大——
# 這個專案沒有用到任何新版 API 才有的功能。
#
# 【為什麼放在 src/test/resources 而不是家目錄】
#
# 這一行是跨平台的，Linux 的 CI runner 一樣適用，
# 所以它應該進版控，讓每個 clone 的人自動拿到。
#
# ⚠️ 對比：docker.host（pipe 名稱）就「不可以」進版控，
#    那是 Windows + Docker Desktop 專屬的，會讓 CI 直接爆掉。
#    設定該放哪裡，取決於它是「環境專屬」還是「專案共通」。
#
# 【什麼時候要回來改這裡】
#
# 未來某版 Docker 若把最低版本拉到 1.44 以上，這個值要跟著往上調。
# 症狀會是一模一樣的 400 與同一句誤導訊息。
#
# Day 22 加入。參考 testcontainers-java issue #11212 / #11560。
# =============================================================================

api.version=1.44
