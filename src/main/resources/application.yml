# Base configuration, tuned for local development: SQL is printed, logging is
# verbose, health details are exposed.
#
# Profiles layer on top of this rather than replacing it:
#   application-test.yml  activated by @ActiveProfiles("test")
#   application-prod.yml  activated by SPRING_PROFILES_ACTIVE=prod
#
# Each of those lists only what differs, so every setting has exactly one
# place where it is defined.

spring:
  application:
    name: sift

  datasource:
    # No default for the password: failing to start beats starting with a wrong one.
    url: jdbc:postgresql://${SIFT_DB_HOST:localhost}:${SIFT_DB_PORT:5432}/${SIFT_DB_NAME:sift}
    username: ${SIFT_DB_USER:sift}
    password: ${SIFT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    hibernate:
      # validate, never update: the schema is owned by Flyway.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # Off, so a lazy load outside the service layer fails loudly instead of
    # silently issuing queries while the view renders.
    open-in-view: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  flyway:
    enabled: true
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.flywaydb: INFO
    dev.sift: DEBUG

sift:
  jwt:
    secret: ${SIFT_JWT_SECRET}
    access-token-ttl-minutes: ${SIFT_JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${SIFT_JWT_REFRESH_TTL_DAYS:7}

  encryption:
    # Separate from the JWT secret on purpose: the two have different blast
    # radiuses, and rotating one must not break the other.
    secret: ${SIFT_ENCRYPTION_SECRET}

  scheduling:
    # Master switch for every scheduled task. Off under the test profile.
    enabled: ${SIFT_SCHEDULING_ENABLED:true}

  cleanup:
    refresh-token-cron: ${SIFT_CLEANUP_CRON:0 0 3 * * *}

  fetch:
    # Allows outbound requests to loopback and private ranges. Must stay false
    # in production: true disables SSRF protection entirely.
    allow-internal-address: ${SIFT_FETCH_ALLOW_INTERNAL:false}
    connect-timeout: ${SIFT_FETCH_CONNECT_TIMEOUT:5s}
    request-timeout: ${SIFT_FETCH_REQUEST_TIMEOUT:10s}
    max-body-bytes: ${SIFT_FETCH_MAX_BODY_BYTES:5242880}

    # Spring cron has six fields; the first is seconds.
    cron: ${SIFT_FETCH_CRON:0 0 6 * * *}

    # How long before an unfinished job counts as abandoned. Must be well above
    # any legitimate runtime: too tight and the reaper kills live work.
    stuck-timeout: ${SIFT_FETCH_STUCK_TIMEOUT:10m}
    reap-interval-ms: ${SIFT_FETCH_REAP_INTERVAL_MS:300000}

  async:
    # False swaps the fetch thread pool for a synchronous executor, which is
    # what makes the integration tests deterministic.
    enabled: ${SIFT_ASYNC_ENABLED:true}

  summarize:
    # Whether the fake summarizer is registered at all. Never enable in
    # production: hiding it from the UI would not stop a direct API call.
    allow-fake: ${SIFT_SUMMARIZE_ALLOW_FAKE:false}

    gemini:
      base-url: ${SIFT_GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/interactions}
      model: ${SIFT_GEMINI_MODEL:gemini-3.8-flash}
      timeout: ${SIFT_GEMINI_TIMEOUT:30s}
      max-chars: ${SIFT_GEMINI_MAX_CHARS:6000}

    batch-size: ${SIFT_SUMMARIZE_BATCH_SIZE:5}
    daily-quota: ${SIFT_SUMMARIZE_DAILY_QUOTA:200}
    interval-ms: ${SIFT_SUMMARIZE_INTERVAL_MS:60000}
    initial-delay-ms: ${SIFT_SUMMARIZE_INITIAL_DELAY_MS:20000}

    retry:
      max-attempts: ${SIFT_SUMMARIZE_MAX_ATTEMPTS:3}
      base-delay: ${SIFT_SUMMARIZE_BASE_DELAY:60s}
      # Randomises the backoff so a batch of failures does not retry in lockstep.
      jitter-ratio: ${SIFT_SUMMARIZE_JITTER_RATIO:0.2}
