<!DOCTYPE html>
<!--
  Sift 的操作介面。

  【為什麼是一個檔案、沒有框架】

  這個專案的重點是後端的管線與可靠性設計，前端存在的目的只有一個：
  讓那條管線的成果看得見。

  用 React 就要有 npm、build 流程、一堆設定檔，而那些東西對這個專案
  沒有帶來任何價值。一個 HTML 檔放進 src/main/resources/static/，
  Spring Boot 直接就會提供，不需要任何額外設定。

  【token 為什麼不放 localStorage】

  localStorage 的內容任何在這個網域執行的 JavaScript 都讀得到。
  一旦頁面上有 XSS，token 就等於直接送給攻擊者。

  放在 JS 變數裡的話，重新整理會消失（要重新登入），
  但攻擊者沒辦法從別的腳本讀到它。

  這是一個取捨：用「重新整理要重登」換「XSS 時 token 不外洩」。
  對這個專案來說划算。
-->
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sift</title>
    <style>
        :root {
            --border: #d8d8d8;
            --muted: #6b6b6b;
            --bg-soft: #fafafa;
            --accent: #1a1a1a;
            --danger: #b02a2a;
            --ok: #2a7a4a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: #1a1a1a;
            background: #fff;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: baseline;
            gap: 16px;
        }

        header h1 { font-size: 20px; margin: 0; letter-spacing: 2px; }
        header .sub { color: var(--muted); font-size: 13px; }
        header .spacer { flex: 1; }

        main { padding: 24px; max-width: 1200px; }

        /* ---------- 登入畫面 ---------- */

        #login-view { max-width: 340px; margin: 60px auto; }

        /* ---------- 主畫面：左右兩欄 ---------- */

        #app-view { display: none; grid-template-columns: 320px 1fr; gap: 28px; }
        #app-view.active { display: grid; }

        h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px;
             color: var(--muted); margin: 0 0 12px; font-weight: 600; }

        /* ---------- 表單元件 ---------- */

        input, select, button {
            font-family: inherit;
            font-size: 14px;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: #fff;
        }

        input { width: 100%; margin-bottom: 8px; }

        button {
            cursor: pointer;
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        button:hover { opacity: .85; }
        button.plain { background: #fff; color: var(--muted); border-color: var(--border); }
        button:disabled { opacity: .45; cursor: default; }

        /* ---------- 來源清單 ---------- */

        .source {
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .source:hover { background: var(--bg-soft); }
        .source.selected { border-color: var(--accent); background: var(--bg-soft); }
        .source .name { font-weight: 600; }
        .source .url { color: var(--muted); font-size: 12px; word-break: break-all; }
        .source .row { display: flex; gap: 8px; margin-top: 8px; }
        .source .row button { padding: 3px 8px; font-size: 12px; }

        /* ---------- 文章 ---------- */

        .item {
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
        }
        .item a { color: inherit; font-weight: 600; text-decoration: none; }
        .item a:hover { text-decoration: underline; }
        .item .summary { color: #333; margin-top: 6px; }
        .item .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }

        /* 狀態標籤 */
        .tag {
            display: inline-block; font-size: 11px; padding: 1px 6px;
            border-radius: 2px; border: 1px solid var(--border);
            color: var(--muted); margin-right: 6px;
        }
        .tag.READY  { border-color: var(--ok);     color: var(--ok); }
        .tag.FAILED { border-color: var(--danger); color: var(--danger); }

        .empty { color: var(--muted); padding: 20px 0; }
        .error { color: var(--danger); font-size: 13px; margin: 8px 0; min-height: 20px; }
        .hint  { color: var(--muted); font-size: 12px; margin-top: 4px; }
    </style>
</head>

<body>

<header>
    <h1>SIFT</h1>
    <span class="sub">個人知識庫 · 自動內容管線</span>
    <span class="spacer"></span>
    <span id="who" class="sub"></span>
    <button id="logout-btn" class="plain" style="display:none">登出</button>
</header>

<main>

    <!-- ============ 登入 ============ -->
    <section id="login-view">
        <h2>登入</h2>
        <input id="email" type="email" placeholder="email" autocomplete="username">
        <input id="password" type="password" placeholder="密碼" autocomplete="current-password">
        <button id="login-btn" style="width:100%">登入</button>
        <div id="login-error" class="error"></div>
    </section>

    <!-- ============ 主畫面 ============ -->
    <section id="app-view">

        <!-- ---- 左欄：來源 ---- -->
        <div>
            <h2>訂閱來源</h2>

            <div style="border:1px solid var(--border);border-radius:3px;padding:12px;margin-bottom:16px">
                <input id="new-name" placeholder="名稱">
                <input id="new-url" placeholder="網址（填首頁也可以）">
                <button id="add-btn" style="width:100%">新增</button>
                <div class="hint">新增時會當場試抓一次，抓不到就不會存進去。</div>
                <div id="add-error" class="error"></div>
            </div>

            <div id="sources"></div>

            <h2 style="margin-top:24px">LLM API KEY</h2>
            <div style="border:1px solid var(--border);border-radius:3px;padding:12px">
                <div id="key-state" class="hint" style="margin-bottom:8px"></div>
                <input id="api-key" type="password" placeholder="貼上你的 API key">
                <button id="key-btn" style="width:100%">儲存</button>
                <div class="hint">加密後儲存，之後只看得到遮罩形式。</div>
            </div>
        </div>

        <!-- ---- 右欄：文章 ---- -->
        <div>
            <h2 id="items-title">文章</h2>
            <div id="items"><div class="empty">左邊選一個來源。</div></div>
        </div>

    </section>

</main>

<script>
/* ==========================================================================
   狀態
   ==========================================================================

   token 存在這個變數裡，不進 localStorage。
   代價是重新整理就要重新登入，換到的是「XSS 時 token 不會被別的腳本讀走」。
   ========================================================================== */

let token = null;
let selectedSourceId = null;

const $ = (id) => document.getElementById(id);

/* --------------------------------------------------------------------------
   共用的請求函式

   所有對 API 的呼叫都走這裡，好處是「token 怎麼帶」「錯誤怎麼讀」
   只需要寫一次。
   -------------------------------------------------------------------------- */
async function api(path, options = {}) {

    const res = await fetch('/api/v1' + path, {
        ...options,
        headers: {
            'Content-Type': 'application/json',
            ...(token ? { Authorization: 'Bearer ' + token } : {}),
            ...(options.headers || {}),
        },
    });

    if (res.status === 204) return null;

    const text = await res.text();
    const body = text ? JSON.parse(text) : null;

    if (!res.ok) {
        /*
         * 後端的錯誤格式是 RFC 7807 Problem Details，
         * 裡面的 detail 是寫給人看的訊息，直接拿來顯示。
         */
        throw new Error(body?.detail || body?.title || ('請求失敗：' + res.status));
    }

    return body;
}

/* --------------------------------------------------------------------------
   登入
   -------------------------------------------------------------------------- */

async function login() {
    $('login-error').textContent = '';

    try {
        const body = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({
                email: $('email').value.trim(),
                password: $('password').value,
            }),
        });

        token = body.accessToken;

        $('login-view').style.display = 'none';
        $('app-view').classList.add('active');
        $('logout-btn').style.display = 'inline-block';
        $('who').textContent = $('email').value.trim();

        await Promise.all([loadSources(), loadKeyState()]);

    } catch (e) {
        $('login-error').textContent = e.message;
    }
}

function logout() {
    token = null;
    selectedSourceId = null;
    $('app-view').classList.remove('active');
    $('login-view').style.display = 'block';
    $('logout-btn').style.display = 'none';
    $('who').textContent = '';
    $('password').value = '';
}

/* --------------------------------------------------------------------------
   來源
   -------------------------------------------------------------------------- */

async function loadSources() {
    const sources = await api('/sources');
    const box = $('sources');

    if (sources.length === 0) {
        box.innerHTML = '<div class="empty">還沒有訂閱來源。</div>';
        return;
    }

    box.innerHTML = '';

    for (const s of sources) {
        const el = document.createElement('div');
        el.className = 'source' + (s.id === selectedSourceId ? ' selected' : '');

        /*
         * 用 textContent 而不是 innerHTML 塞使用者資料。
         *
         * 名稱與網址是使用者輸入的，直接塞進 innerHTML 的話，
         * 有人取名 <img src=x onerror=...> 就會被執行——那是 XSS。
         */
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = s.name + (s.enabled ? '' : '（已停用）');

        const url = document.createElement('div');
        url.className = 'url';
        url.textContent = s.url;

        const row = document.createElement('div');
        row.className = 'row';

        const toggle = document.createElement('button');
        toggle.className = 'plain';
        toggle.textContent = s.enabled ? '停用' : '啟用';
        toggle.onclick = async (ev) => {
            ev.stopPropagation();
            await api('/sources/' + s.id, {
                method: 'PATCH',
                body: JSON.stringify({ enabled: !s.enabled }),
            });
            await loadSources();
        };

        const del = document.createElement('button');
        del.className = 'plain';
        del.textContent = '刪除';
        del.onclick = async (ev) => {
            ev.stopPropagation();
            if (!confirm('確定要刪除「' + s.name + '」？已抓下來的文章會保留。')) return;
            await api('/sources/' + s.id, { method: 'DELETE' });
            if (selectedSourceId === s.id) selectedSourceId = null;
            await loadSources();
        };

        row.append(toggle, del);
        el.append(name, url, row);

        el.onclick = () => selectSource(s.id, s.name);
        box.appendChild(el);
    }
}

async function addSource() {
    $('add-error').textContent = '';
    $('add-btn').disabled = true;
    $('add-btn').textContent = '驗證中…';

    try {
        await api('/sources', {
            method: 'POST',
            body: JSON.stringify({
                name: $('new-name').value.trim(),
                url: $('new-url').value.trim(),
                type: 'RSS',
            }),
        });

        $('new-name').value = '';
        $('new-url').value = '';
        await loadSources();

    } catch (e) {
        $('add-error').textContent = e.message;

    } finally {
        $('add-btn').disabled = false;
        $('add-btn').textContent = '新增';
    }
}

/* --------------------------------------------------------------------------
   文章
   -------------------------------------------------------------------------- */

async function selectSource(id, name) {
    selectedSourceId = id;
    $('items-title').textContent = name;
    await loadSources();     // 重畫左欄，讓選中的那個變色

    const items = await api('/sources/' + id + '/items?limit=50');
    const box = $('items');

    if (items.length === 0) {
        box.innerHTML = '<div class="empty">這個來源還沒有抓到文章。'
                      + '排程每分鐘跑一次，稍等一下再看。</div>';
        return;
    }

    box.innerHTML = '';

    for (const item of items) {
        const el = document.createElement('div');
        el.className = 'item';

        const link = document.createElement('a');
        link.href = item.externalUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';   // 不讓對方的頁面透過 opener 操作我們
        link.textContent = item.title;

        const meta = document.createElement('div');
        meta.className = 'meta';

        const tag = document.createElement('span');
        tag.className = 'tag ' + item.status;
        tag.textContent = item.status;
        meta.appendChild(tag);

        if (item.publishedAt) {
            meta.append(new Date(item.publishedAt).toLocaleString('zh-TW'));
        }

        el.append(link);

        if (item.summary) {
            const s = document.createElement('div');
            s.className = 'summary';
            s.textContent = item.summary;
            el.append(s);

        } else if (item.failureReason) {
            const s = document.createElement('div');
            s.className = 'summary';
            s.style.color = 'var(--danger)';
            s.textContent = '摘要失敗：' + item.failureReason;
            el.append(s);
        }

        el.append(meta);
        box.appendChild(el);
    }
}

/* --------------------------------------------------------------------------
   API key
   -------------------------------------------------------------------------- */

async function loadKeyState() {
    const me = await api('/me');

    $('key-state').textContent = me.llmApiKeyMasked
            ? '目前：' + me.llmApiKeyMasked
            : '尚未設定。沒有 key 的話文章會停在 NEW，不會產生摘要。';
}

async function saveKey() {
    const value = $('api-key').value.trim();
    if (!value) return;

    await api('/me/llm-key', {
        method: 'PUT',
        body: JSON.stringify({ apiKey: value }),
    });

    $('api-key').value = '';
    await loadKeyState();
}

/* --------------------------------------------------------------------------
   綁定
   -------------------------------------------------------------------------- */

$('login-btn').onclick = login;
$('logout-btn').onclick = logout;
$('add-btn').onclick = addSource;
$('key-btn').onclick = saveKey;

// Enter 直接登入
$('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login();
});
</script>

</body>
</html>
